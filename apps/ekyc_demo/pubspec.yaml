name: ekyc_demo
description: >-
  Reference e-KYC app: MRZ scan, NFC chip reading with Passive
  Authentication, and face capture, built on icao_mrz and icao_mrtd.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  bloc: ^9.0.0
  camera: ^0.12.2
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_nfc_kit: ^3.6.2
  google_mlkit_face_detection: ^1.0.1
  google_mlkit_text_recognition: ^1.0.1
  icao_mrtd: ^0.1.0-dev.1
  icao_mrz: ^0.1.0-dev.1
  intl: any

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/csca/
    - assets/demo/
