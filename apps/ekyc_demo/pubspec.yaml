name: ekyc_demo
description: >-
  Reference e-KYC app: MRZ scan, NFC chip reading with Passive
  Authentication, and face capture, built on icao_mrz and icao_mrtd.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  bloc: ^9.0.0
  ekyc_nfc_reader: ^0.1.0-dev.1
  ekyc_sdk: ^0.1.0-dev.1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  icao_mrtd: ^0.1.0-dev.1
  icao_mrz: ^0.1.0-dev.1
  intl: any
  material_ui: ^1.11.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/csca/
    - assets/demo/
