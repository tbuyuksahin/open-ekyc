name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed packages
      - run: dart analyze --fatal-infos packages
      - name: Test with coverage (90 % minimum per package)
        run: |
          for p in packages/*; do
            if grep -q "sdk: flutter" "$p/pubspec.yaml"; then
              (cd "$p" && flutter test --coverage && awk -F: '/^LF:/{t+=$2} /^LH:/{h+=$2} END{c=100*h/t; printf "%s: %.1f%%\n", ENVIRON["PWD"], c; exit c < 90}' coverage/lcov.info)
            else
              (cd "$p" && dart run coverage:test_with_coverage --fail-under=90)
            fi
          done

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ekyc_demo
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build appbundle --release
      - name: Store rejection check (preflight)
        run: |
          dart pub global activate preflight
          dart pub global run preflight --platform android --strict

  ios:
    name: iOS build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ekyc_demo
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --no-codesign --debug
      - name: Store rejection check (preflight)
        run: |
          dart pub global activate preflight
          dart pub global run preflight --platform ios --strict --skip ios-xcode-version
