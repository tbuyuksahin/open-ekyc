name: ekyc_document_capture
description: >-
  Photograph the front and back of ID cards and passports in Flutter with
  on-device quality checks and a printed text cross-check against the MRZ
  or chip.
version: 0.1.0-dev.3
repository: https://github.com/tbuyuksahin/open-ekyc/tree/main/packages/ekyc_document_capture
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  camera: ^0.12.2
  ekyc_camera: ^0.1.0-dev.3
  flutter:
    sdk: flutter
  google_mlkit_commons: ^1.0.1
  google_mlkit_face_detection: ^1.0.1
  google_mlkit_text_recognition: ^1.0.1
  icao_mrz: ^0.1.0-dev.3
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
