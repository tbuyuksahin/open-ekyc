name: ekyc_document_capture
description: >-
  Capture the front and back of an ID card or a passport page in Flutter:
  on-device sharpness, glare and side checks, automatic or manual capture,
  and a cross-check of the printed text against the MRZ or chip data.
version: 0.1.0-dev.2
repository: https://github.com/tbuyuksahin/open-ekyc/tree/main/packages/ekyc_document_capture
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  camera: ^0.12.2
  ekyc_camera: ^0.1.0-dev.2
  flutter:
    sdk: flutter
  google_mlkit_commons: ^1.0.1
  google_mlkit_face_detection: ^1.0.1
  google_mlkit_text_recognition: ^1.0.1
  icao_mrz: ^0.1.0-dev.2
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
