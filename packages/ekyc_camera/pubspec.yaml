name: ekyc_camera
description: >-
  Camera plumbing shared by the open-ekyc capture packages: an ML Kit frame
  stream that follows the app lifecycle, a cover-fit preview and an overlay
  scrim.
version: 0.1.0-dev.1
repository: https://github.com/tbuyuksahin/open-ekyc/tree/main/packages/ekyc_camera
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  camera: ^0.12.2
  camera_platform_interface: ^2.15.0
  flutter:
    sdk: flutter
  google_mlkit_commons: ^1.0.1
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
