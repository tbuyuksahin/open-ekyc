name: ekyc_face_capture
description: >-
  Capture a good selfie for face matching in Flutter: on-device ML Kit
  quality gate with automatic capture, an animated oval guide and a
  liveness check interface.
version: 0.1.0-dev.1
repository: https://github.com/tbuyuksahin/open-ekyc/tree/main/packages/ekyc_face_capture
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  camera: ^0.12.2
  ekyc_camera: ^0.1.0-dev.1
  flutter:
    sdk: flutter
  google_mlkit_face_detection: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
