name: ekyc_mrz_scanner
description: >-
  Scan the machine readable zone of passports and ID cards with the camera
  (on-device ML Kit OCR), with a document template overlay and a manual
  entry form that builds the chip access key.
version: 0.1.0-dev.1
repository: https://github.com/tbuyuksahin/open-ekyc/tree/main/packages/ekyc_mrz_scanner
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  camera: ^0.12.2
  ekyc_camera: ^0.1.0-dev.1
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^1.0.1
  icao_mrz: ^0.1.0-dev.1
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
